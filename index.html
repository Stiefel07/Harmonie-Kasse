function localize(root=document){const dict=translations[lang]||{},reverse={};for(const map of Object.values(translations))for(const [de,tr]of Object.entries(map))if(tr&&!reverse[tr])reverse[tr]=de;const canonical=text=>{let s=text;for(const [tr,de]of Object.entries(reverse).sort((a,b)=>b[0].length-a[0].length))s=s.replaceAll(tr,de);return s.replace(/(\d+)\s*(นาที|min\.)/gi,'$1 Min.')};const translate=text=>{const base=canonical(text);if(dict[base])return dict[base];let out=base.replace(/(\d+) Min\./g,(_,m)=>`${m} ${lang==='th'?'นาที':'min'}`).replace(/^(\d+) (Leistung|Leistungen) · (.+)$/,(all,num,word,date)=>lang==='th'?`${num} รายการ · ${date}`:`${num} ${num==='1'?'service':'services'} · ${date}`);for(const [de,tr]of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length))if(de!==base&&out.includes(de))out=out.replaceAll(de,tr);return out};const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;const leading=raw.match(/^\s*/)?.[0]||'',trailing=raw.match(/\s*$/)?.[0]||'';n.nodeValue=leading+translate(trim)+trailing}root.querySelectorAll?.('[placeholder],[aria-label]').forEach(el=>{for(const attr of ['placeholder','aria-label'])if(el.hasAttribute(attr))el.setAttribute(attr,translate(el.getAttribute(attr)))});root.querySelectorAll?.('[data-language]').forEach(el=>el.value=lang)}

me"></div><div class="field"><label>Rolle</label><select name="role"><option value="staff" ${st?.role!=="manager"?"selected":""}>Mitarbeiterin</option><option value="manager" ${st?.role==="manager"?"selected":""}>Manager</option></select></div><div class="field"><label>Passwort</label><input name="password" ${st?'':'required'} type="text" value="${st?esc(st.password):''}" placeholder="Passwort"></div><div class="wide" style="display:flex;gap:8px"><button class="btn small">${st?'Änderungen speichern':'Mitarbeiter hinzufügen'}</button>${st?'<button class="btn ghost small" type="button" id="cancelStaff">Abbrechen</button>':''}</div></form><div style="margin-top:20px">${data.staff.map(x=>`<div class="staff-row"><div><strong>${esc(x.name)}</strong><div class="muted" style="font-size:13px">${x.role==='admin'?'Administrator':x.role==='manager'?'Manager':'Mitarbeiterin'} · ${x.active?'Aktiv':'Deaktiviert'}</div></div>${x.role==='admin'&&x.id==='admin'?'<span class="muted" style="font-size:12px">Standard-Admin</span>':`<div class="row-actions"><button class="btn secondary small" data-edit-staff="${esc(x.id)}">Bearbeiten</button><button class="btn ${x.active?'danger':'secondary'} small" data-toggle-staff="${esc(x.id)}">${x.active?'Deaktivieren':'Aktivieren'}</button></div>`}</div>`).join('')}</div><div class="notice" style="margin-top:18px">MVP-Hinweis: Daten und Passwörter werden in diesem Browser gespeichert. Für mehrere Geräte oder produktiven Betrieb ist später ein geschützter Server mit zentraler Datenbank nötig.</div></section></div>`;

function renderAdminPasswordPanel(){const current=data.staff.find(x=>x.id===user.id&&x.role==='admin');if(!current)return;$('#main').insertAdjacentHTML('beforeend',`<section class="card" style="margin-top:18px"><h2>Admin-Passwort ändern</h2><p class="sub">Ändere das Demo-Passwort für diesen Browser.</p><form id="adminPasswordForm" class="formgrid"><div class="field"><label>Aktuelles Passwort</label><input name="current" type="password" autocomplete="current-password" required></div><div class="field"><label>Neues Passwort</label><input name="next" type="password" minlength="10" autocomplete="new-password" required placeholder="Mindestens 10 Zeichen"></div><div class="field"><label>Neues Passwort bestätigen</label><input name="confirm" type="password" minlength="10" autocomplete="new-password" required></div><div class="wide"><div id="passwordError" class="error"></div><button class="btn small">Passwort ändern</button></div></form></section>`);localize($('#main'));$('#adminPasswordForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),old=String(f.get('current')),next=String(f.get('next')),confirm=String(f.get('confirm'));let error='';if(current.password!==old)error='Das aktuelle Passwort ist falsch.';else if(next.length<10)error='Das neue Passwort muss mindestens 10 Zeichen haben.';else if(next!==confirm)error='Die Passwörter stimmen nicht überein.';if(error){$('#passwordError').textContent=error;localize($('#passwordError'));return}current.password=next;save();e.target.reset();showToast('Admin-Passwort wurde geändert.')}}
