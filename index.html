<style>
#postScanTipDialog{width:min(440px,calc(100vw - 24px));max-width:calc(100vw - 24px);border:1px solid #eadfd9;border-radius:18px;padding:0;background:#fffdfb;color:#21352e;box-shadow:0 20px 70px #162b2366}
#postScanTipDialog::backdrop{background:#17231ecc}
.post-tip-head{padding:17px 20px 12px;background:linear-gradient(120deg,#fff1df,#f0f7f1);border-top:6px solid #e98d45}
.post-tip-head h2{margin:0;font-size:20px}
.post-tip-content{display:grid;gap:14px;padding:18px 20px}
.post-tip-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.post-tip-actions button{min-height:42px;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.post-tip-no{background:#f1f3f1;color:#45574e}
.post-tip-yes,.post-tip-save{background:#3c7968;color:white}
.post-tip-back{background:#f8e8ee;color:#28584e}
.post-tip-amount[hidden],.post-tip-question[hidden]{display:none!important}
@media(max-width:480px){.post-tip-content{padding:15px}.post-tip-head{padding:15px 16px 10px}}
</style>
<dialog id="postScanTipDialog" aria-labelledby="postTipTitle">
  <div class="post-tip-head"><h2 id="postTipTitle"></h2></div>
  <div class="post-tip-content">
    <p id="postTipQuestion" class="post-tip-question"></p>
    <div id="postTipAmount" class="post-tip-amount" hidden>
      <div class="field"><label id="postTipLabel" for="postTipInput"></label><input id="postTipInput" type="number" inputmode="decimal" min="0" step="0.01"></div>
    </div>
    <div class="post-tip-actions post-tip-question" id="postTipQuestionActions">
      <button type="button" class="post-tip-no" id="postTipNo"></button>
      <button type="button" class="post-tip-yes" id="postTipYes"></button>
    </div>
    <div class="post-tip-actions post-tip-amount" id="postTipAmountActions" hidden>
      <button type="button" class="post-tip-back" id="postTipBack"></button>
      <button type="button" class="post-tip-save" id="postTipSave"></button>
    </div>
  </div>
</dialog>
<script>
(function(){
  const dialog=document.getElementById('promptpayDialog');
  const tipDialog=document.getElementById('postScanTipDialog');
  if(!dialog||!tipDialog)return;
  const closeButton=document.getElementById('promptpayClose');
  let receiptIds=[],initialTip=0,tipSaved=false;
  function language(){return document.querySelector('[data-language]')?.value||'th'}
  function labels(){
    const current=language();
    if(current==='th')return{qrTitle:'สแกนเพื่อชำระเงิน',qrHelp:'ใช้แอปธนาคารสแกน QR นี้ และตรวจสอบยอดก่อนยืนยัน',qrClose:'ปิด',tipTitle:'ตรวจสอบทิป',tipQuestion:'มีทิปในการชำระเงินด้วยการสแกนนี้หรือไม่?',tipLabel:'ทิปรวม (฿)',no:'ไม่มีทิป',yes:'มีทิป',back:'ย้อนกลับ',save:'บันทึกทิปแล้ว',saved:'บันทึกทิปให้พนักงานแล้ว'};
    if(current==='en')return{qrTitle:'Scan to pay',qrHelp:'Scan with your banking app and check the amount before confirming.',qrClose:'Close',tipTitle:'Confirm tip',tipQuestion:'Was a tip included in this scan payment?',tipLabel:'Total tip (฿)',no:'No tip',yes:'Yes, enter amount',back:'Back',save:'Save tip',saved:'Tip credited to staff.'};
    return{qrTitle:'Zum Bezahlen scannen',qrHelp:'Mit der Banking-App scannen und den Betrag vor der Bestätigung prüfen.',qrClose:'Schließen',tipTitle:'Trinkgeld bestätigen',tipQuestion:'War bei dieser Scan-Zahlung Trinkgeld enthalten?',tipLabel:'Gesamtes Trinkgeld (฿)',no:'Nein, kein Trinkgeld',yes:'Ja, Betrag eingeben',back:'Zurück',save:'Trinkgeld speichern',saved:'Trinkgeld der Mitarbeiterin gutgeschrieben.'};
  }
  function setQrText(){
    const text=labels();
    document.getElementById('promptpayTitle').textContent=text.qrTitle;
    document.getElementById('promptpayHelp').textContent=text.qrHelp;
    closeButton.textContent=text.qrClose;
    closeButton.setAttribute('aria-label',text.qrClose);
  }
  function closeDialog(target){if(typeof target.close==='function')target.close();else target.removeAttribute('open')}
  window.openPromptpayDialog=function(formattedAmount,ids,tipAmount){
    receiptIds=Array.isArray(ids)?ids:[];
    initialTip=Number(tipAmount)||0;
    tipSaved=false;
    document.getElementById('promptpayAmount').textContent=formattedAmount||'';
    setQrText();
    if(typeof dialog.showModal==='function')dialog.showModal();else dialog.setAttribute('open','');
  };
  function openTipQuestion(){
    if(tipSaved)return;
    const text=labels();
    document.getElementById('postTipTitle').textContent=text.tipTitle;
    document.getElementById('postTipQuestion').textContent=text.tipQuestion;
    document.getElementById('postTipLabel').textContent=text.tipLabel;
    document.getElementById('postTipInput').value=initialTip.toFixed(2).replace(/\.00$/,'');
    document.getElementById('postTipNo').textContent=text.no;
    document.getElementById('postTipYes').textContent=text.yes;
    document.getElementById('postTipBack').textContent=text.back;
    document.getElementById('postTipSave').textContent=text.save;
    document.getElementById('postTipQuestion').hidden=false;
    document.getElementById('postTipQuestionActions').hidden=false;
    document.getElementById('postTipAmount').hidden=true;
    document.getElementById('postTipAmountActions').hidden=true;
    if(typeof tipDialog.showModal==='function')tipDialog.showModal();else tipDialog.setAttribute('open','');
  }
  closeButton.addEventListener('click',()=>closeDialog(dialog));
  dialog.addEventListener('click',event=>{if(event.target===dialog)closeDialog(dialog)});
  dialog.addEventListener('close',openTipQuestion);
  document.getElementById('postTipNo').addEventListener('click',()=>{
    if(typeof window.savePostScanTip==='function')window.savePostScanTip(receiptIds,0);
    tipSaved=true;
    closeDialog(tipDialog);
  });
  document.getElementById('postTipYes').addEventListener('click',()=>{
    document.getElementById('postTipQuestion').hidden=true;
    document.getElementById('postTipQuestionActions').hidden=true;
    document.getElementById('postTipAmount').hidden=false;
    document.getElementById('postTipAmountActions').hidden=false;
    document.getElementById('postTipInput').focus();
  });
  document.getElementById('postTipBack').addEventListener('click',()=>{
    document.getElementById('postTipQuestion').hidden=false;
    document.getElementById('postTipQuestionActions').hidden=false;
    document.getElementById('postTipAmount').hidden=true;
    document.getElementById('postTipAmountActions').hidden=true;
  });
  document.getElementById('postTipSave').addEventListener('click',()=>{
    const input=document.getElementById('postTipInput');
    const amount=Math.round(Math.max(0,Number(input.value)||0)*100)/100;
    if(typeof window.savePostScanTip==='function'&&window.savePostScanTip(receiptIds,amount)){
      tipSaved=true;
      closeDialog(tipDialog);
    }
  });
})();
</script></body></html>
