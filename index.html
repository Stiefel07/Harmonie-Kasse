function localize(root=document){const dict=translations[lang]||{},reverse={};for(const map of Object.values(translations))for(const [de,tr]of Object.entries(map))if(tr&&!reverse[tr])reverse[tr]=de;const canonical=text=>{if(reverse[text])return reverse[text];if(Object.values(translations).some(map=>Object.prototype.hasOwnProperty.call(map,text)))return text;let s=text;for(const [tr,de]of Object.entries(reverse).sort((a,b)=>b[0].length-a[0].length)){if(/^[A-Za-z0-9]/.test(tr)&&/[A-Za-z0-9]$/.test(tr)){const escaped=tr.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),pattern=new RegExp('(^|[^A-Za-z0-9])'+escaped+'(?=$|[^A-Za-z0-9])','gi');s=s.replace(pattern,(_,prefix)=>prefix+de)}}return s.replace(/(\d+)\s*(นาที|min\.?)/gi,'$1 Min.')};const translate=text=>{const base=canonical(text);if(lang==='de')return base;if(dict[base])return dict[base];let out=base.replace(/(\d+) Min\./g,(_,m)=>`${m} ${lang==='th'?'นาที':'min'}`).replace(/^(\d+) (Leistung|Leistungen) · (.+)$/,(all,num,word,date)=>lang==='th'?`${num} รายการ · ${date}`:`${num} ${num==='1'?'service':'services'} · ${date}`);for(const [de,tr]of Object.entries(dict).sort((a,b)=>b[0].length-a[0].length))if(de!==base&&out.includes(de))out=out.replaceAll(de,tr);return out};const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){const raw=n.nodeValue,trim=raw.trim();if(!trim)continue;const leading=raw.match(/^\s*/)?.[0]||'',trailing=raw.match(/\s*$/)?.[0]||'';n.nodeValue=leading+translate(trim)+trailing}root.querySelectorAll?.('[placeholder],[aria-label]').forEach(el=>{for(const attr of ['placeholder','aria-label'])if(el.hasAttribute(attr))el.setAttribute(attr,translate(el.getAttribute(attr)))});root.querySelectorAll?.('[data-language]').forEach(el=>el.value=lang)}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data));if(!cloudReady)return;cloudSaveQueue=cloudSaveQueue.catch(()=>{}).then(async()=>{const snapshot=structuredClone(data);cloudSavePending++;try{cloudBaseline=await saveShopData(snapshot,cloudBaseline)}catch(error){console.error('Firebase-Synchronisierung fehlgeschlagen',error);showToast('Firebase-Synchronisierung fehlgeschlagen.');throw error}finally{cloudSavePending--}})}
function toHex(bytes){return [...new Uint8Array(bytes)].map(value=>value.toString(16).padStart(2,'0')).join('')}
function fromHex(value){return new Uint8Array((value.match(/.{1,2}/g)||[]).map(byte=>parseInt(byte,16)))}
async function passwordRecord(password){const salt=crypto.getRandomValues(new Uint8Array(16)),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);return{passwordSalt:toHex(salt),passwordHash:toHex(bits)}}
async function verifyStaffPassword(staff,password){if(staff.password)return staff.password===password;if(!staff.passwordSalt||!staff.passwordHash)return false;const salt=fromHex(staff.passwordSalt),key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']),bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:210000,hash:'SHA-256'},key,256);return toHex(bits)===staff.passwordHash}
async function hashLegacyStaffPasswords(){let changed=false;for(const staff of data.staff){if(staff.password){Object.assign(staff,await passwordRecord(staff.password));delete staff.password;changed=true}}if(changed)localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}

setzt.');if(tab==='staffAdmin')renderStaffManager();else if(tab==='admin')renderAdmin()}}document.addEventListener('click',e=>{const b=e.target.closest('[data-reset-password]');if(b)openPasswordReset(b.dataset.resetPassword)});
